services:
  tenant-test-mongodb:
    image: mongo:7.0
    restart: "no"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - saas_registration_test_mongo:/data/db

  tenant-test-api:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      tenant-test-mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://tenant-test-mongodb:27017
      DB_NAME: procurement_saas_registration_test
      JWT_SECRET: saas_registration_test_jwt_secret_only
      ADMIN_EMAIL: bootstrap-saas-test@example.test
      ADMIN_PASSWORD: BootstrapSaasTest!123
      DEFAULT_TENANT_ID: tenant-pt-real
      DEFAULT_COMPANY_ID: company-pt-real
      DEFAULT_TENANT_SLUG: pt-real
      DEFAULT_TENANT_NAME: PT REAL TEST
      DEFAULT_TENANT_MAX_USERS: 25
      ENABLE_PUBLIC_TENANT_REGISTRATION: "true"
      TENANT_TRIAL_DAYS: 14
      DISABLE_LEGACY_USER_SELF_REGISTER: "true"
      PLATFORM_ADMIN_EMAIL: platform-test@example.test
      PLATFORM_ADMIN_PASSWORD: PlatformTest!123
      PLATFORM_ADMIN_NAME: Platform Test Admin
      ALLOW_DEMO_SEED: "false"
      WRITE_TEST_CREDENTIALS: "false"
      STORAGE_DRIVER: local
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/docs"]
      interval: 2s
      timeout: 3s
      retries: 45

  saas-registration-test-runner:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      tenant-test-mongodb:
        condition: service_healthy
      tenant-test-api:
        condition: service_healthy
    environment:
      TEST_API_URL: http://tenant-test-api:8000/api
      MONGO_URL: mongodb://tenant-test-mongodb:27017
      DB_NAME: procurement_saas_registration_test
      PLATFORM_ADMIN_EMAIL: platform-test@example.test
      PLATFORM_ADMIN_PASSWORD: PlatformTest!123
    command: ["python", "saas_registration_integration_test.py"]

volumes:
  saas_registration_test_mongo:
