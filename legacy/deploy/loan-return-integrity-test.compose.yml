services:
  loan-return-mongodb:
    image: mongo:7.0
    restart: "no"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - loan_return_integrity_test_mongo:/data/db

  loan-return-api:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      loan-return-mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://loan-return-mongodb:27017
      DB_NAME: procurement_loan_return_integrity_test
      JWT_SECRET: ${SAAS_STAGING_JWT_SECRET:?SAAS_STAGING_JWT_SECRET wajib tersedia}
      ADMIN_EMAIL: ${SAAS_STAGING_ADMIN_EMAIL:?SAAS_STAGING_ADMIN_EMAIL wajib tersedia}
      ADMIN_PASSWORD: ${SAAS_STAGING_ADMIN_PASSWORD:?SAAS_STAGING_ADMIN_PASSWORD wajib tersedia}
      DEFAULT_TENANT_ID: tenant-loan-return-test
      DEFAULT_COMPANY_ID: company-loan-return-test
      DEFAULT_TENANT_SLUG: loan-return-test
      DEFAULT_TENANT_NAME: PT REAL LOAN RETURN TEST
      DEFAULT_TENANT_MAX_USERS: 25
      ENABLE_PUBLIC_TENANT_REGISTRATION: "false"
      DISABLE_LEGACY_USER_SELF_REGISTER: "true"
      ALLOW_DEMO_SEED: "false"
      WRITE_TEST_CREDENTIALS: "false"
      STORAGE_DRIVER: local
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/docs"]
      interval: 2s
      timeout: 3s
      retries: 45

  loan-return-runner:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      loan-return-mongodb:
        condition: service_healthy
      loan-return-api:
        condition: service_healthy
    environment:
      TEST_API_URL: http://loan-return-api:8000/api
      ADMIN_EMAIL: ${SAAS_STAGING_ADMIN_EMAIL:?SAAS_STAGING_ADMIN_EMAIL wajib tersedia}
      ADMIN_PASSWORD: ${SAAS_STAGING_ADMIN_PASSWORD:?SAAS_STAGING_ADMIN_PASSWORD wajib tersedia}
    command: ["python", "loan_return_integrity_test.py"]

volumes:
  loan_return_integrity_test_mongo:
