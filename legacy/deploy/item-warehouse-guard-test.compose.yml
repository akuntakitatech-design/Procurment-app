services:
  item-warehouse-guard-mongodb:
    image: mongo:7.0
    restart: "no"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - procurement_item_warehouse_guard_test_mongo:/data/db

  item-warehouse-guard-api:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      item-warehouse-guard-mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://item-warehouse-guard-mongodb:27017
      DB_NAME: procurement_item_warehouse_guard_test
      JWT_SECRET: ${SAAS_STAGING_JWT_SECRET:?SAAS_STAGING_JWT_SECRET wajib tersedia}
      ADMIN_EMAIL: ${SAAS_STAGING_ADMIN_EMAIL:?SAAS_STAGING_ADMIN_EMAIL wajib tersedia}
      ADMIN_PASSWORD: ${SAAS_STAGING_ADMIN_PASSWORD:?SAAS_STAGING_ADMIN_PASSWORD wajib tersedia}
      DEFAULT_TENANT_ID: tenant-item-warehouse-guard-test
      DEFAULT_COMPANY_ID: company-item-warehouse-guard-test
      DEFAULT_TENANT_SLUG: item-warehouse-guard-test
      DEFAULT_TENANT_NAME: PT REAL ITEM WAREHOUSE GUARD TEST
      DEFAULT_TENANT_MAX_USERS: 25
      ENABLE_PUBLIC_TENANT_REGISTRATION: "false"
      DISABLE_LEGACY_USER_SELF_REGISTER: "true"
      ALLOW_DEMO_SEED: "false"
      WRITE_TEST_CREDENTIALS: "false"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/data/uploads
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/docs"]
      interval: 2s
      timeout: 3s
      retries: 45

  item-warehouse-guard-runner:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      item-warehouse-guard-mongodb:
        condition: service_healthy
      item-warehouse-guard-api:
        condition: service_healthy
    environment:
      TEST_API_URL: http://item-warehouse-guard-api:8000/api
      ADMIN_EMAIL: ${SAAS_STAGING_ADMIN_EMAIL:?SAAS_STAGING_ADMIN_EMAIL wajib tersedia}
      ADMIN_PASSWORD: ${SAAS_STAGING_ADMIN_PASSWORD:?SAAS_STAGING_ADMIN_PASSWORD wajib tersedia}
    command: ["python", "item_warehouse_guard_integrity_test.py"]

volumes:
  procurement_item_warehouse_guard_test_mongo:
