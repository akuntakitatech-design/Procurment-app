services:
  tenant-test-mongodb:
    image: mongo:7.0
    restart: "no"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - tenant_api_test_mongo:/data/db

  tenant-test-api:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      tenant-test-mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://tenant-test-mongodb:27017
      DB_NAME: procurement_tenant_api_test
      JWT_SECRET: tenant_api_test_jwt_secret_only
      ADMIN_EMAIL: bootstrap-api-test@example.test
      ADMIN_PASSWORD: BootstrapTest!123
      DEFAULT_TENANT_ID: tenant-pt-real
      DEFAULT_COMPANY_ID: company-pt-real
      DEFAULT_TENANT_SLUG: pt-real
      DEFAULT_TENANT_NAME: PT REAL TEST
      DEFAULT_TENANT_MAX_USERS: 25
      ALLOW_DEMO_SEED: "false"
      WRITE_TEST_CREDENTIALS: "false"
      STORAGE_DRIVER: local
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/docs"]
      interval: 2s
      timeout: 3s
      retries: 45

  tenant-api-test-runner:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      tenant-test-mongodb:
        condition: service_healthy
      tenant-test-api:
        condition: service_healthy
    environment:
      TEST_API_URL: http://tenant-test-api:8000/api
      MONGO_URL: mongodb://tenant-test-mongodb:27017
      DB_NAME: procurement_tenant_api_test
      JWT_SECRET: tenant_api_test_jwt_secret_only
      DEFAULT_TENANT_ID: tenant-pt-real
      DEFAULT_COMPANY_ID: company-pt-real
    command: ["python", "tenant_api_isolation_integration_test.py"]

volumes:
  tenant_api_test_mongo:
