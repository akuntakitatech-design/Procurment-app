services:
  approval-test-mongodb:
    image: mongo:7.0
    restart: "no"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - approval_state_test_mongo:/data/db

  approval-test-api:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      approval-test-mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://approval-test-mongodb:27017
      DB_NAME: procurement_approval_state_test
      JWT_SECRET: procurement_approval_state_test_secret_only
      ADMIN_EMAIL: approval-admin@example.test
      ADMIN_PASSWORD: ApprovalAdmin!123
      DEFAULT_TENANT_ID: tenant-pt-real
      DEFAULT_COMPANY_ID: company-pt-real
      DEFAULT_TENANT_SLUG: pt-real
      DEFAULT_TENANT_NAME: PT REAL APPROVAL TEST
      DEFAULT_TENANT_MAX_USERS: 25
      ENABLE_PUBLIC_TENANT_REGISTRATION: "false"
      DISABLE_LEGACY_USER_SELF_REGISTER: "true"
      ALLOW_DEMO_SEED: "false"
      WRITE_TEST_CREDENTIALS: "false"
      STORAGE_DRIVER: local
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/docs"]
      interval: 2s
      timeout: 3s
      retries: 45

  approval-test-runner:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      approval-test-mongodb:
        condition: service_healthy
      approval-test-api:
        condition: service_healthy
    environment:
      TEST_API_URL: http://approval-test-api:8000/api
      TEST_MONGO_URL: mongodb://approval-test-mongodb:27017
      TEST_DB_NAME: procurement_approval_state_test
      ADMIN_EMAIL: approval-admin@example.test
      ADMIN_PASSWORD: ApprovalAdmin!123
    command: ["python", "approval_state_integration_test.py"]

volumes:
  approval_state_test_mongo:
